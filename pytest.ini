[pytest]
qt_api = pyside6
testpaths = tests
addopts = -ra
markers =
    unit: lightweight unit test (no Qt, no model weights)
    gui: GUI test requiring PySide6 + a display (pytest-qt)
filterwarnings =
    # PySide6 marks the 5-arg QMouseEvent ctor as deprecated (device arg added)
    # but it remains the simplest functional form for synthesizing test events.
    ignore:.*QMouseEvent.QMouseEvent.*is marked as deprecated.*:DeprecationWarning
